<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS选择器</title>
    <style>
        /* 元素选择器 */
        h2 {
            color: red;
        }
        /* 类选择器 */
        .yudeh {
            color: rgb(98, 255, 0);
        }
        /* id选择器 */
        #keyi {
            color:purple;
        }
        /* 通用选择器 */
        * {
            font-family: "kaiti";
            font-weight: bolder;
        }
        /* 子元素选择器 */
        .yes > .son {
            color:aquamarine;
        }
        /* 后代选择器 */
        .yes p{
            color:blue;
        }
        /* 相邻兄弟选择器 */
        h3 + p{
            background-color: yellow;
        }
        #adjacent:hover{
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1>不同类型的选择器</h1>
    <h2>元素选择器练习</h2>
    <h3 class="yudeh">类选择器实例1</h3>
    <h3 >类选择器实例2</h3>
    <h4 id="keyi">id选择器示例</h4>
<div class="yes">
    <p class="son">这是子元素选择器示例</p>
    <p class="11">这是子元素选择器示例2</p>
    <div>
        <p class="grandson">这是后代选择器示例</p>
    </div>

</div>
<p>这是一个普通的p标签</p>
<h3>相邻标签选择器示例</h3>
<p>另一个p标签</p>
<h3 id="adjacent">伪类选择器示例</h3>
</body>
</html>
