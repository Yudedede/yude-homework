<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    .box1 {
        width: 500px;
        height: 300px;
        background-color: red;
    }
    .box-normal {
        width: 100px;
        height: 100px;
        background-color: blue;
    }
    .box-relative {
        width: 100px;
        height: 100px;
        background-color: green;
        position: relative;
        left: 100px;
        top:40px;
    }
    .box2 {
        height: 350px;
        background-color: yellow;
    }
    .box-absolute{
        width: 100px;
        height: 100px;
        background-color: purple;
        position:absolute;
        left: 120px;
    }
    .box-fixed {
      width: 100px;
      height: 100px;
    background-color: brown;
    position:fixed;
    right:0;
    top: 30px;
    }
    </style>
</head>
<body>
    <h1>相对定位</h1>
    <div class="box1">
        <div class="box-normal"></div>
        <div class="box-relative"></div>
        <div class="box-normal"></div>

    </div>
    <h1>绝对定位</h1>
    <div class="box2">
        <div class="box-normal"></div>
        <div class="box-absolute"></div>
        <div class="box-normal"></div>
    </div>
<h1>固定定位</h1>
<div class="box-fixed">美女直播点击观看
</div>
</body>
</html>
