<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本标签练习</title>
</head>
<body>
  <h1>一级标签</h1>
  <h2>二级标签</h2>
  <h3>三级标签</h3>
  <h4>四级标签</h4>
  <h5>五级标签</h5>
  <h6>六级标签</h6>
  <p>这是一个段落标签</p>
  <p>更改文本样式： <b>粗体测试</b>, <strong>粗体再测试</strong>, <i>斜体测试</i>,<u>下划线测试</u> ,<s>删除线测试</s>
</p>
  <ul>
    <li>无序列表1</li>
    <li>无序列表2</li>
    <li>无序列表3</li>
  </ul>
  <ol>
    <li>有序列表1</li>
    <li>有序列表2</li>
    <li>有序列表3</li>
  </ol>
  <table border="1">
    <tr>
        <th>表格标题1</th>
        <th>表格标题2</th>
        <th>表格标题3</th>
    </tr>
    <tr>
        <td>元素1</td>
        <td>元素2</td>
        <td>元素3</td>
    </tr>
    <tr>
        <td>元素4</td>
        <td>元素5</td>
        <td>元素6</td>
    </tr>
    <tr>
        <td>元素7</td>
        <td>元素8</td>
        <td>元素9</td>
    </tr>
  </table>
</body>
</html>
